[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kcn-integration-layer"
version = "0.11.0"
description = "KCN Integration Layer – Phase 11"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_control_plane*", "data_fabric*", "event_orchestration*", "identity_federation*", "service_mesh*"]
